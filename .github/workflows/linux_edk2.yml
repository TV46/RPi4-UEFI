name: UEFI firmware - EDK2 build

on:
  workflow_dispatch:

env:
  PROJECT_URL: https://github.com/pftf/RPi4
  RPI_FIRMWARE_URL: https://github.com/raspberrypi/firmware/
  ARCH: AARCH64
  COMPILER: GCC
  GCC_AARCH64_PREFIX: aarch64-linux-gnu-
  # The following should usually be set to 'master' but, in case
  # of a regression, a specific SHA-1 can be specified.
  START_ELF_VERSION: master
  # Set to pre HDMI/Audio changes per https://github.com/pftf/RPi4/issues/252
  DTB_VERSION: b49983637106e5fb33e2ae60d8c15a53187541e4
  DTBO_VERSION: master

jobs:
  UEFI-Build:
    runs-on: ubuntu-latest

    steps:
    
    - name: Set up Linux environment
      run: |
        sudo apt update
        sudo apt install acpica-tools gcc-aarch64-linux-gnu uuid-dev

    - name: Check out RPi4 repository
      uses: actions/checkout@v7

    - name: Check out latest EDK2
      run: |
        git clone --recursive https://github.com/tianocore/edk2.git edk2

    - name: Check out latest EDK2 Platforms
      run: |
        git clone --recursive https://github.com/tianocore/edk2-platforms.git edk2-platforms

    - name: Check out latest EDK2 Non-OSI
      run: |
        git clone --recursive https://github.com/tianocore/edk2-non-osi.git edk2-non-osi
        
    - name: Set version
      id: set_version
      working-directory: edk2
      run: |
        VERSION=$(git describe --tags --always --dirty)
        echo "version=$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Set up EDK2
      run: make -C edk2/BaseTools

    - name: Set up Secure Boot default keys
      run: |
        mkdir keys
        # We don't really need a usable PK, so just generate a public key for it and discard the private key
        openssl req -new -x509 -newkey rsa:2048 -subj "/CN=Raspberry Pi Platform Key/" -keyout /dev/null -outform DER -out keys/pk.cer -days 7300 -nodes -sha256
        curl -L https://go.microsoft.com/fwlink/?LinkId=321185 -o keys/kek_2011_ms.cer
        curl -L https://go.microsoft.com/fwlink/?linkid=2239775 -o keys/kek_2023_ms.cer
        curl -L https://go.microsoft.com/fwlink/?linkid=321192 -o keys/db_2011_win_ms.cer
        curl -L https://go.microsoft.com/fwlink/?linkid=321194 -o keys/db_2011_3rd_ms.cer
        curl -L https://go.microsoft.com/fwlink/?linkid=2239776 -o keys/db_2023_win_ms.cer
        curl -L https://go.microsoft.com/fwlink/?linkid=2239872 -o keys/db_2023_3rd_ms.cer
        curl -L https://go.microsoft.com/fwlink/?linkid=2284009 -o keys/db_2023_opt_ms.cer
        curl -L https://github.com/microsoft/secureboot_objects/raw/main/PostSignedObjects/SignedByKEK2023/dbx_aarch64.efiauth2 -o keys/dbx_arm64.bin

    - name: Build UEFI firmware
      run: |
        export WORKSPACE=$PWD
        export PACKAGES_PATH=$WORKSPACE/edk2:$WORKSPACE/edk2-platforms:$WORKSPACE/edk2-non-osi
        export BUILD_FLAGS="-D SECURE_BOOT_ENABLE=TRUE -D INCLUDE_TFTP_COMMAND=TRUE -D NETWORK_ISCSI_ENABLE=TRUE -D SMC_PCI_SUPPORT=1"
        export TLS_DISABLE_FLAGS="-D NETWORK_TLS_ENABLE=FALSE -D NETWORK_ALLOW_HTTP_CONNECTIONS=TRUE"
        export DEFAULT_KEYS="-D DEFAULT_KEYS=TRUE -D PK_DEFAULT_FILE=$WORKSPACE/keys/pk.cer -D KEK_DEFAULT_FILE1=$WORKSPACE/keys/kek_2011_ms.cer -D KEK_DEFAULT_FILE2=$WORKSPACE/keys/kek_2023_ms.cer -D DB_DEFAULT_FILE1=$WORKSPACE/keys/db_2011_win_ms.cer -D DB_DEFAULT_FILE2=$WORKSPACE/keys/db_2011_3rd_ms.cer -D DB_DEFAULT_FILE3=$WORKSPACE/keys/db_2023_win_ms.cer -D DB_DEFAULT_FILE4=$WORKSPACE/keys/db_2023_3rd_ms.cer -D DB_DEFAULT_FILE5=$WORKSPACE/keys/db_2023_opt_ms.cer -D DBX_DEFAULT_FILE1=$WORKSPACE/keys/dbx_arm64.bin"
        # EDK2's 'build' command doesn't play nice with spaces in environmnent variables, so we can't move the PCDs there...
        source edk2/edksetup.sh
        for BUILD_TYPE in DEBUG RELEASE; do
          build -a ${{ env.ARCH }} -t ${{ env.COMPILER }} -b $BUILD_TYPE -p edk2-platforms/Platform/RaspberryPi/RPi4/RPi4.dsc --pcd gEfiMdeModulePkgTokenSpaceGuid.PcdFirmwareVendor=L"${{ env.PROJECT_URL }}" --pcd gEfiMdeModulePkgTokenSpaceGuid.PcdFirmwareVersionString=L"UEFI Firmware ${{steps.set_version.outputs.version}}" ${BUILD_FLAGS} ${DEFAULT_KEYS} ${TLS_DISABLE_FLAGS}
          TLS_DISABLE_FLAGS=""
        done

    - name: Upload UEFI firmware artifacts
      uses: actions/upload-artifact@v7
      with:
        name: RPi4 UEFI Firmware ${{ steps.set_version.outputs.version }} Artifacts
        path: |
          Build/RPi4/**/FV/RPI_EFI.fd
